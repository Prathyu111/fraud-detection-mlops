name: Fraud Detection CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    env:
      MODEL_URI: deployment_model

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build image
        run: |
          docker build \
            -t fraud-detection-api:ci \
            .

      - name: Start container
        run: |
          docker run -d \
            --name fraud-api \
            -p 8000:8000 \
            fraud-detection-api:ci

      - name: Wait for healthy API
        run: |
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi

            sleep 2
          done

          docker logs fraud-api
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f fraud-api || true

  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: Azure/setup-kubectl@v5
        with:
          version: "v1.36.1"

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/base \
            > rendered-manifests.yaml

      - name: Validate Kubernetes manifests
        run: |
          docker run \
            --rm \
            -i \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            < rendered-manifests.yaml